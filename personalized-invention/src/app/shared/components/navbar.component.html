<nav class="pi-nav">
  <div class="pi-nav__brand">
    <a routerLink="/">
      <span class="pi-nav__logo">PI</span>
      <span class="pi-nav__name">Personalized Invention</span>
    </a>
  </div>

  <div class="pi-nav__links">
    <a routerLink="/"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      Shop
    </a>

    @if (currentUser) {
      <a routerLink="/orders" routerLinkActive="active">My Orders</a>

      <a routerLink="/cart" routerLinkActive="active" class="pi-nav__cart">
        <span class="pi-nav__cart-icon">🛒</span>
        @if (cartCount > 0) {
          <span class="pi-nav__badge">{{ cartCount }}</span>
        }
      </a>

      <div class="pi-nav__user">
        <span class="pi-nav__greeting">
          Hi, {{ currentUser.fullName.split(' ')[0] }}
        </span>
        <button class="pi-nav__logout" (click)="logout()">Logout</button>
      </div>
    } @else {
      <a routerLink="/login" routerLinkActive="active" class="pi-nav__auth-link">
        Sign In
      </a>
      <a routerLink="/register" class="pi-nav__auth-btn">
        Register
      </a>
    }
  </div>
</nav>
