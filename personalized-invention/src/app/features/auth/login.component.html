<div class="pi-auth">
  <div class="pi-auth__card">
    <div class="pi-auth__logo">
      <span class="pi-auth__logo-badge">PI</span>
      <h1>Personalized Invention</h1>
    </div>

    <h2>Welcome back</h2>
    <p class="pi-auth__subtitle">Sign in to your account</p>

    @if (errorMessage) {
      <div class="pi-auth__error">⚠️ {{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="pi-auth__field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required />
      </div>

      <div class="pi-auth__field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required />
      </div>

      <button type="submit" class="pi-auth__btn" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="pi-auth__switch">
      Don't have an account?
      <a routerLink="/register">Create one here</a>
    </p>
  </div>
</div>
